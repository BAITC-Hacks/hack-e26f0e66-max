_comment: Generated by the calibrator agent from the observed distributions. Committed
  so that `python run.py` reproduces exactly these thresholds. Delete this file, or
  pass --recalibrate, to run the agent again. Each threshold's rationale is below
  and is reproduced in the README.
_model: gpt-6-luna
thresholds:
  consolidator.min_payers: 5
  consolidator.strong_payers: 10
  distributor.min_recipients: 10
  distributor.strong_recipients: 25
  distributor.fan_ratio: 3
  transit.ratio_low: 0.8
  transit.ratio_high: 1.2
  terminal.max_pass: 0.05
  coordinator.min_key_payers: 2
  coordinator.min_seed_reach_percentile: 0.9
rationale:
  consolidator.min_payers: The in-degree threshold of 5 is above the p95 value of
    3 and below the p99 value of 6, making it a round tail gate for candidate review.
  consolidator.strong_payers: The in-degree p99 is 6, so 10 is a round, more selective
    threshold for the strong-payer level.
  distributor.min_recipients: The out-degree p95 is 5 and p99 is 23.53, so 10 is a
    round tail threshold that avoids treating ordinary small recipient counts as unusual.
  distributor.strong_recipients: The out-degree p99 is 23.53, so 25 is a round threshold
    above that percentile for the stronger tier.
  distributor.fan_ratio: The fan-ratio p95 is 3, so requiring a ratio of at least
    3 selects the upper tail while retaining the role's separate recipient-count gate.
  transit.ratio_low: The 0.8–1.2 band is reported to contain 70 nodes, providing a
    narrow, percentile-grounded candidate set around parity rather than a broad near-balance
    rule.
  transit.ratio_high: The 0.8–1.2 band is reported to contain 70 nodes, providing
    a narrow, percentile-grounded candidate set around parity rather than a broad
    near-balance rule.
  terminal.max_pass: The supplied count at pass ratio <=0.05 is 1,110, a low-tail-supported
    cut intended to be more selective than the current 0.1 threshold.
  coordinator.min_key_payers: The current-gate approximation has 279 nodes with at
    least 2 key payers versus 104 with at least 3, so 2 retains a populated but more
    selective collection-point gate.
  coordinator.min_seed_reach_percentile: A 0.9 percentile cutoff is the top decile
    by definition and matches the seed_reach p90 value of 9 as a round percentile-based
    gate.
simulated_counts:
  terminal: 1100
  peripheral: 540
  cutoff: 444
  transit: 67
  consolidator: 51
  distributor: 46
expected_concerns:
- 'The terminal role may remain unusually large: 1,110 nodes have pass_ratio <=0.05,
  and nodes at maximum traversal depth have truncated onward flow, so some are pattern-consistent
  with terminal status only because of the traversal boundary; verify candidate gids
  before treating this as a finding.'
- No account gids were supplied, so these are rule-calibration hypotheses only and
  no account-specific candidate claims can be cited.
- The supplied distributions do not give exact role counts for the proposed settings;
  verify that each resulting role is populated and none is dominant after applying
  the gates.
