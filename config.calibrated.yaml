_comment: Generated by the calibrator agent from the observed distributions. Committed
  so that `python run.py` reproduces exactly these thresholds. Delete this file, or
  pass --recalibrate, to run the agent again. Each threshold's rationale is below
  and is reproduced in the README.
_model: gpt-6-sol
thresholds:
  consolidator.min_payers: 5
  consolidator.strong_payers: 10
  distributor.min_recipients: 10
  distributor.fan_ratio: 3
  distributor.strong_recipients: 25
  transit.ratio_low: 0.9
  transit.ratio_high: 1.1
  terminal.max_pass: 0.05
  coordinator.min_key_payers: 2
  coordinator.min_seed_reach_percentile: 0.9
rationale:
  consolidator.min_payers: Five payers exceeds the in-degree p95 of 3, making this
    a candidate-for-review gate rather than a multiple-payer test.
  consolidator.strong_payers: Ten payers exceeds the in-degree p99 of 6, reserving
    full confidence for an especially unusual collection pattern.
  distributor.min_recipients: Ten recipients exceeds the out-degree p95 of 5, selecting
    an unusual payout pattern for review.
  distributor.fan_ratio: A fan ratio of 3 sits at p95, requiring pronounced outward
    branching alongside the recipient gate.
  distributor.strong_recipients: Twenty-five recipients exceeds the out-degree p99
    of 23.53, reserving full confidence for the extreme tail.
  transit.ratio_low: A lower bound of 0.9, paired with 1.1, selects the 50 accounts
    in the supplied 0.9–1.1 band, a narrow pattern consistent with near-equal inflow
    and outflow.
  transit.ratio_high: An upper bound of 1.1, paired with 0.9, selects the same 50-account
    near-parity band rather than the 70 accounts in the wider 0.8–1.2 band.
  terminal.max_pass: A maximum pass share of 0.05 is above the pass-ratio median of
    zero but below p75 of 0.5707, limiting this candidate-for-review pattern to minimal
    onward flow.
  coordinator.min_key_payers: Two key payers reaches the approximate key-payer p90
    of 2, requiring more than one qualifying payer before considering this collection
    pattern.
  coordinator.min_seed_reach_percentile: The 0.9 cutoff explicitly requires top-decile
    seed reach, whose p90 value is 9.
simulated_counts:
  terminal: 1100
  peripheral: 560
  cutoff: 444
  consolidator: 51
  transit: 47
  distributor: 46
expected_concerns:
- 'The terminal role may remain dominant: 1,110 accounts have pass ratios at or below
  0.05, and the current terminal count is 1,129; the threshold alone cannot establish
  a sparse finding.'
- Accounts at maximum traversal depth have truncated onward flow and must remain excluded
  from terminal assignment.
- The joint gates could leave the coordinator role empty; the supplied marginal percentiles
  cannot establish its populated count.
- No gids were supplied, so account-level claims or cited examples cannot be made;
  an analyst should verify role counts and candidate accounts against gid-level output.
