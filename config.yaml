# ============================================================================
# Money Graph — every threshold and weight lives here (guideline.md §16).
# No magic numbers in src/ or app/. No gids here or anywhere else.
#
# Every value below carries the distribution it came from. Percentiles are from
# outputs/profile_report.md §6, computed over all 2,248 nodes. Re-run
# `python -m moneygraph.profile` after any data change and re-check these.
# ============================================================================

seed: 42                       # single random seed for Louvain and layouts

# ---------------------------------------------------------------------------
# Facts announced in the brief and in data/README.md. They live here rather
# than in code so that profile.py contains no numeric literals at all, and so
# that a change in the organizers' data is a one-line config edit. Every one of
# these is CHECKED against the files, never trusted (guideline §3).
# ---------------------------------------------------------------------------
expected:
  n_nodes: 2248
  n_edges: 3119
  n_tx: 4840
  n_seeds: 81
  hop_distribution: {0: 81, 1: 472, 2: 462, 3: 789, 4: 444}
  total_turnover_kzt: 365890012
  n_truncated: 444              # MAX_DEPTH nodes with no outgoing edge
  n_seeds_absent_from_edges: 19
  n_seeds_receive_only: 12
  # "16 components ... plus the 19 isolated seeds" -> 16 of size >= 2, 35 total.
  n_components_multi: 16
  n_isolated_seeds: 19
  # Counts nodes that have a traced inflow. Without that restriction it is 377,
  # because a node with in_sum == 0 trivially sends more than it receives.
  n_sent_exceeds_received: 354
  # Counts the RAW out/in ratio including seeds; our seed-excluded pass_ratio
  # puts 70 nodes in the band. Both are reported.
  n_pass_ratio_band: 72
  pass_ratio_band: [0.8, 1.2]
  min_amount_kzt: 5000

paths:
  data: data                   # folder to ingest; any tabular files, see `input`
  outputs: output_files        # all deliverables land here

# ---------------------------------------------------------------------------
# Role gates (guideline §8.2). Values are round and explainable on purpose —
# "at least 5 distinct payers" defends to a jury; "4.7" does not.
# ---------------------------------------------------------------------------
roles:
  # Switch for the documented 7th role. False -> those nodes become peripheral
  # with a cut-off note in the evidence.
  use_extended_roles: true

  consolidator:
    # in_deg p95 = 3, p99 = 6, max = 24. A cut at 5 selects 51 nodes (2.3%),
    # i.e. just inside the top percentile: "receives from an unusual number of
    # distinct payers" rather than "receives from more than one person".
    min_payers: 5
    # 10 payers selects 7 nodes (~p99.7). Full confidence is reached there.
    strong_payers: 10

  distributor:
    # out_deg p95 = 5, p99 = 24, max = 116. A cut at 10 selects 64 nodes (2.8%).
    min_recipients: 10
    # Fan-out must also dominate fan-in, otherwise a busy hub that both collects
    # and pays out would be filed as a distributor. 10-and-3x selects 56 nodes.
    fan_ratio: 3
    # 50 recipients selects 8 nodes — the visible top of the distribution.
    strong_recipients: 50

  transit:
    # Money in ~= money out. The band [0.8, 1.2] holds 70 non-seed nodes
    # (72 if seeds are counted, which we do not: their inflow is understated).
    ratio_low: 0.8
    ratio_high: 1.2
    # Speed turns "balanced" into "consistent with transit": forwarded within
    # this many days of an inflow. 2 days keeps it inside a working week.
    max_lag_days: 2
    # Share of outgoing KZT forwarded that fast, above which confidence is boosted.
    fast_pass_boost_share: 0.5

  terminal:
    # Money arrives and stays: at most 10% forwarded.
    max_pass: 0.1
    # NOTE (profile §7): this gate matches 1,143 nodes at depth < MAX_DEPTH,
    # of which 1,079 have no outgoing edge at all. That is not a bug — those
    # nodes WERE expanded by the crawl and simply had nothing >= 5,000 KZT
    # leaving them. It is still half the graph, so `terminal` carries little
    # information on its own; priority is driven by the other components, and
    # peripheral/terminal nodes get the lowest role weight below.
    # `terminal` is never assigned at MAX_DEPTH — that is the 444-false-sinks fix.

  coordinator:
    # Second pass: a collection point that collects from OTHER collection
    # points, with money from many separate courier chains reaching it.
    #
    # A coordinator must itself pass the consolidator gate. Without that, the
    # rule degenerates: on this data it promoted 264 nodes (11.7% of the graph),
    # 103 of them `terminal` — accounts where money demonstrably stays, which is
    # the opposite of a controller. Requiring convergence leaves 9.
    require_consolidator_gate: true
    min_key_payers: 2            # payers whose own role is consolidator/distributor/transit
    # seed_reach is NEVER used as an absolute. Its range is entirely
    # data-dependent: here p50=7 and max=15, so the guideline's ">= 5" selects
    # 71% of the graph and carries no information. A percentile rescales with
    # whatever input the tool is pointed at.
    min_seed_reach_percentile: 0.90
    # Alternative route in: extreme seed reach plus money arriving from more
    # than one cluster.
    seed_reach_percentile: 0.99
    min_payer_clusters: 2

# ---------------------------------------------------------------------------
# role_score (guideline §8.4)
# ---------------------------------------------------------------------------
scoring:
  base: 0.5                      # a passed gate is worth 0.5 before strength
  span: 0.5                      # strength between threshold and "strong" adds up to 0.5
  penalty_max_depth: 0.8         # outflow unknown -> the role is less certain
  penalty_unreliable_inflow: 0.8 # inflow understated (seeds) -> likewise
  peripheral_quiet: 0.9          # <= 1 edge: confident that nothing is going on
  peripheral_noisy: 0.6          # several edges but no gate passed: less confident
  cutoff_fixed: 0.7              # traversal artifact, stated as such

# ---------------------------------------------------------------------------
# Clustering (guideline §9)
# ---------------------------------------------------------------------------
clustering:
  resolution: 1.0                # Louvain default; raise to split the 1,877-node component
  min_cluster_size: 3            # smaller weakly connected components stay their own cluster
  stability_seeds: [42, 43, 44, 45, 46]   # co-membership stability check
  max_hypothesis_chars: 250

# ---------------------------------------------------------------------------
# Priority score (guideline §10). Weights sum to 1.0; components are percentile
# ranks, so no single raw amount can dominate.
# ---------------------------------------------------------------------------
priority:
  weights:
    role: 0.30
    seed_money: 0.25             # percentile of seed_kzt_attributed
    seed_reach: 0.20             # percentile of seed_reach
    payers: 0.15                 # percentile of in_deg
    cluster: 0.10                # cluster seed density, percentile

  role_weight:
    coordinator: 1.00
    consolidator: 0.90
    distributor: 0.60
    transit: 0.50
    terminal: 0.50
    cutoff: 0.30
    peripheral: 0.05

  # Law enforcement already knows the 81 seeds; the analyst's value is above them.
  seed_discount: 0.5
  # A collector or controller sitting on the traversal frontier is the best
  # candidate for a hop-5 data request, because the chain probably continues.
  cutoff_boost: 1.1

  top_n: 30                      # top_nodes.csv rows (>= 20 required)

# ---------------------------------------------------------------------------
# Evidence and wording (guideline §2, §11)
# ---------------------------------------------------------------------------
evidence:
  max_chars: 200
  max_why_chars: 200
  # Never appear in any generated string. Enforced by tests/test_outputs.py.
  forbidden_words:
    - criminal
    - guilty
    - launderer
    - "organizer is"
    - confirmed

# ---------------------------------------------------------------------------
# Optional features (guideline §14). Off by default so the must-haves stay fast.
# ---------------------------------------------------------------------------
extras:
  cycles: {enabled: false, length_bound: 5}
  resilience: {enabled: false, remove_top_n: [5, 10, 20]}
  anomalies: {enabled: false, near_threshold_kzt: 5500, round_amount_modulo: 100000}
  completeness: {enabled: true}

# ===========================================================================
# INPUT DISCOVERY
# The brief promises three parquet files, but the tool must not depend on
# that. Ingestion discovers whatever tabular files it is pointed at and maps
# their columns onto the canonical schema below. The deterministic matcher
# runs first; the ingest agent is consulted only for columns it cannot
# resolve, and its answer is validated against the data before use.
# ===========================================================================
input:
  # Extensions scanned, in preference order.
  extensions: [".parquet", ".csv", ".tsv", ".json", ".jsonl", ".xlsx"]
  recursive: true
  max_files: 32
  # Rows sampled per file when profiling columns for the mapping step.
  sample_rows: 2000
  # Canonical fields and the column names that map to them without asking an
  # LLM anything. Matching is case-insensitive and ignores _ - and spaces.
  aliases:
    src: [src, source, from, payer, sender, from_gid, src_gid, payer_gid, debit, otpravitel]
    dst: [dst, dest, destination, to, recipient, receiver, to_gid, dst_gid, beneficiary, credit, poluchatel]
    amount: [sum_kzt, amount, value, sum, amt, total, kzt, summa]
    n_tx: [n_tx, tx_count, count, n, num_tx, transactions]
    date: [date, dt, timestamp, ts, datetime, op_date, tx_date, value_date]
    gid: [gid, id, node, node_id, client_id, customer_id, account, account_id]
    depth: [depth, hop, level, layer, distance]
    is_seed: [is_seed, seed, is_target, flagged, known]
  # A file is classified by which canonical fields it carries.
  #   edges        = src + dst + amount (+ n_tx)   aggregated pairs
  #   transactions = src + dst + amount + date     individual transfers
  #   nodes        = gid (+ depth, is_seed)        the node list
  # If no node list is supplied, the node set is derived from the edges and
  # `depth` is recomputed by BFS from the seeds. If no seeds are supplied,
  # every node with depth 0 (no traced inflow) is treated as a seed and the
  # README-facing report says so loudly.
  derive_nodes_if_missing: true
  derive_depth_if_missing: true

# ===========================================================================
# LLM + AGENT LAYER
# Hard rule (brief §9, guideline §2): agents NEVER decide a role, a score, a
# cluster or a rank. Those come from the rule engine in roles.py, the Louvain
# run in clustering.py and the weighted sum in priority.py. Agents map input
# schemas, phrase text that a validator checks against the rule trace, answer
# analyst questions through deterministic tools, and plan data requests.
# ===========================================================================
llm:
  enabled: true                # set false, or MONEYGRAPH_NO_LLM=1, for a pure offline run

  # --- which model serves the crew ----------------------------------------
  # Three supported setups, in order of how much you have to configure:
  #
  # 1. OpenAI            leave base_url null, put the key in .env
  # 2. Any OpenAI-compatible server (vLLM, Ollama, llama.cpp, TGI, LM Studio,
  #                      OpenRouter, Together, Groq, an internal gateway):
  #                      set base_url + model, key can be a placeholder
  # 3. No model at all   MONEYGRAPH_NO_LLM=1 — everything still runs
  #
  # Env vars override this file, so a self-hosted model needs no code edit:
  #   MONEYGRAPH_BASE_URL   MONEYGRAPH_MODEL   MONEYGRAPH_API_KEY
  provider: openai
  base_url: null               # e.g. http://localhost:8000/v1 for vLLM
  api_key_env: [OPENAI_KEY, OPENAI_API_KEY, MONEYGRAPH_API_KEY]
  model: gpt-6-luna

  # Wire format. `auto` uses the Responses API for single-turn calls (it reports
  # reasoning tokens) and Chat Completions for tool loops. Set `chat` for any
  # self-hosted server — /v1/responses is rare outside OpenAI. A custom
  # base_url switches to `chat` on its own.
  api: auto                    # auto | chat | responses

  reasoning_effort: low        # low | medium | high — low is the cheap test setting
                               # omit/null for models that reject the parameter
  temperature: 0.2
  max_output_tokens: 2000
  timeout_s: 60
  max_retries: 2
  # Hard ceilings for one pipeline run. Exceeding either aborts the agent layer
  # and the run finishes deterministically rather than silently spending more.
  # Ceilings for ONE pipeline run, across the whole crew. Exceeding any of them
  # shuts the agent layer down mid-run; the deterministic pipeline still
  # finishes and every export is still produced.
  budget:
    max_calls: 150
    max_usd: 2.00             # null disables the check
    max_total_tokens: 500000

  # ---- Pricing for the spend tracer -------------------------------------
  # USD per 1,000,000 tokens. Each model has two tiers: requests inside the
  # short-context window and requests beyond it.
  #
  # `cache_write` is recorded for completeness but is only charged when the
  # provider actually reports cache-creation tokens in its usage object. The
  # OpenAI usage payload reports cached tokens as *reads* (`cached_tokens`), so
  # on this stack cache writes come through as ordinary input and the tracer
  # does not invent a separate charge for them.
  pricing:
    # Which tier a call is billed at. A call whose input exceeds this is priced
    # at the long-context rates.
    #
    # ASSUMPTION — confirm against your provider's published boundary. It has no
    # practical effect on this workload: the largest prompt the crew sends is
    # ~5k tokens, three orders of magnitude below any plausible cutoff, so every
    # call here prices at the short tier. It matters only if this is pointed at
    # a far larger graph.
    long_context_threshold_tokens: 200000

    gpt-6-luna:
      short: {input: 0.10, cached_input: 0.01, cache_write: 0.125, output: 0.50}
      long:  {input: 0.20, cached_input: 0.02, cache_write: 0.25,  output: 0.75}
    gpt-6-sol:
      short: {input: 2.00, cached_input: 0.20, cache_write: 2.50,  output: 10.00}
      long:  {input: 4.00, cached_input: 0.40, cache_write: 5.00,  output: 15.00}
    gpt-6-astra:
      short: {input: 10.00, cached_input: 1.00, cache_write: 12.50, output: 50.00}
      long:  {input: 20.00, cached_input: 2.00, cache_write: 25.00, output: 75.00}

agents:
  # Each agent can be switched off independently. Off means its deterministic
  # fallback is used and the run stays valid — no agent is load-bearing for the
  # three CSVs.
  #
  # Division of labour: agents decide WHAT TO EXAMINE and WHAT THE THRESHOLDS
  # SHOULD BE; the rule engine decides WHAT THE ROLE IS. That keeps the system
  # agentic while every role stays traceable to a formal comparison, which the
  # brief requires (§9: a role without an explainable rule does not count).

  planner:
    enabled: true              # picks which passes to run on THIS dataset
    max_investigations: 20     # hard cap the planner cannot exceed

  calibrator:
    enabled: true              # derives role thresholds from the distributions
    max_output_tokens: 4000    # ten thresholds, each with a written rationale
    # Its output is persisted to config.calibrated.yaml and reused, so a
    # submitted run reproduces exactly. `python run.py --recalibrate` redoes it.
    # Every proposal is simulated against the real data before acceptance: a
    # threshold set that empties a role or hands one role half the graph is
    # rejected and the config.yaml defaults are kept.

  investigator:
    enabled: true              # multi-step case dossier per priority account
    max_steps: 6               # tool calls per account before it must conclude
    max_output_tokens: 2000

  critic:
    enabled: true              # argues against the shortlist; writes review_notes.md
    # It writes the longest structured reply in the crew. At the global 2000
    # default its JSON was cut off mid-object on a real run and the whole call
    # was wasted, so it gets its own ceiling.
    max_output_tokens: 6000

  ingest:
    enabled: true              # resolve ambiguous input columns
    only_when_ambiguous: true  # skip the call entirely when the matcher is confident
  narrator:
    enabled: true              # phrase evidence / why / hypothesis from the rule trace
    # Narration is batched to keep cost down: one call per batch of nodes.
    batch_size: 40
    # Only the nodes that matter get LLM phrasing; the rest use templates.
    # Templates are always correct — narration is a readability upgrade, not a
    # correctness dependency.
    scope: top_and_clusters    # top_and_clusters | all | none
  analyst:
    enabled: true              # natural-language Q&A in the viewer
    max_tool_calls: 8
    # A single tool call can return a wide table; it is truncated to this many
    # characters before reaching the model, so one query cannot exhaust the
    # token budget on its own.
    max_tool_result_chars: 20000
  reviewer:
    enabled: true              # completeness assessment -> data_requests.md

# ===========================================================================
# TRACING — wall clock, tokens and spend, for every stage and every LLM call.
# ===========================================================================
tracing:
  enabled: true
  write_json: run_trace.json   # machine-readable, written into output_files/
  write_markdown: run_trace.md # human-readable, shown in the viewer
  print_live: true             # per-stage lines on stdout as the run proceeds
  # The brief's hard latency limit. The pipeline asserts against this.
  max_runtime_s: 300
  # Warn (do not fail) once a stage passes this share of the budget.
  stage_warn_share: 0.25

# ===========================================================================
# VIEWER (Gradio). Reads output_files/ only — it never recomputes.
# ===========================================================================
viewer:
  host: 127.0.0.1
  port: 7860
  share: false
  ego_hops_default: 1
  ego_max_nodes: 300           # beyond this the ego map is capped and says so
  cluster_map_max_nodes: 400
  physics: false               # precomputed layout; keeps large maps responsive
  role_colors:
    coordinator: "#b3202c"
    consolidator: "#d9822b"
    distributor: "#2e7db3"
    transit: "#6f42a1"
    terminal: "#2f8f57"
    cutoff: "#7a7a7a"
    peripheral: "#b9c0c7"

